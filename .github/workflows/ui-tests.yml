name: Playwright UI Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-check:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy type check
        run: python -m mypy app tests

  ui-tests:
    name: ${{ matrix.browser }}
    needs: quality-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install ${{ matrix.browser }} and OS libraries
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Start storefront
        run: |
          python -m app.main > /tmp/storefront.log 2>&1 &
          echo $! > /tmp/storefront.pid

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/health > /dev/null; then
              echo "storefront is ready"
              exit 0
            fi
            sleep 1
          done
          echo "storefront failed to become healthy"
          cat /tmp/storefront.log
          exit 1

      - name: Run real browser tests
        env:
          BROWSER: ${{ matrix.browser }}
          EXTERNAL_SUT_URL: http://127.0.0.1:5000
        run: |
          python -m pytest -n 2 -v \
            --alluredir=allure-results-${{ matrix.browser }} \
            --html=reports/pytest-report-${{ matrix.browser }}.html \
            --self-contained-html

      - name: Stop storefront
        if: always()
        run: |
          if [ -f /tmp/storefront.pid ]; then
            kill "$(cat /tmp/storefront.pid)" 2>/dev/null || true
          fi

      - name: Upload reports and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.browser }}
          path: |
            allure-results-${{ matrix.browser }}/
            reports/
            artifacts/screenshots/
            artifacts/videos/
          if-no-files-found: warn

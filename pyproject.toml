[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "allure-results", "allure-report", "artifacts", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["tests/", "config/"]

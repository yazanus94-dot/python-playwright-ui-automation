[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/pytest-report.html --self-contained-html --alluredir=allure-results
markers =
    smoke: critical customer journeys
    regression: full functional coverage
    negative: invalid inputs and unsupported actions
    isolation: session-isolation scenarios
